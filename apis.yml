  - type: Features
    data:
      - name: Airbag Systems
        description: >-
          Front, side curtain, knee, pedestrian, and center airbag systems for
          passenger vehicles, commercial vehicles, and motorcycles.
      - name: Seatbelt Systems
        description: >-
          Seatbelt assemblies, webbing, and retractors engineered for crash
          performance across all vehicle segments.
      - name: Steering Wheels
        description: >-
          Steering wheel systems including foldable designs for autonomous
          vehicles and advanced driver assistance configurations.
      - name: Pyrotechnic Components
        description: >-
          Inflators, initiators, pyro safety switches, and pyrotechnic actuators
          for airbag deployment and battery disconnect applications.
      - name: HBM Safety Suite
        description: >-
          Software platform supporting occupant safety simulation, virtual
          testing, and digital validation of safety systems.
      - name: Commercial Vehicle Safety
        description: >-
          Seat belt and airbag solutions tailored for trucks, buses, and
          off-road vehicles.
  - type: UseCases
    data:
      - name: OEM Supply Chain Integration
        description: >-
          Tier-1 supplier integration with automotive OEM procurement and
          logistics systems for just-in-time delivery of safety components.
      - name: Supplier Onboarding
        description: >-
          Onboarding new suppliers into Autoliv's global supply base through
          the supplier portal with document management and compliance workflows.
      - name: Connected Safety
        description: >-
          Integration of Autoliv safety systems with vehicle telematics and
          connected car platforms for post-crash notification and safety analytics.
      - name: Safety Simulation
        description: >-
          Virtual occupant safety testing and crash simulation using the HBM
          Safety Suite to accelerate product development and validation.
  - type: Integrations
    data:
      - name: Automotive OEM ERP Systems
        description: >-
          EDI and system integrations with OEM enterprise resource planning
          systems for procurement, logistics, and order management.
      - name: SAP Supply Chain
        description: >-
          Supply chain management integration with SAP systems used across
          Autoliv's global manufacturing network.
      - name: IATF 16949 Quality Systems
        description: >-
          Quality management integrations aligned with the IATF 16949 automotive
          quality management standard.
